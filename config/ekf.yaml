ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.1
    two_d_mode: true
    transform_time_offset: 0.0
    transform_timeout: 0.0
    print_diagnostics: true
    debug: false

    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # Wheel Odometry input
    odom0: odom_wheel
    odom0_config: [true,  true,  false,   # position x, y, z
                   false, false, false,   # orientation r, p, y
                   true,  true,  false,   # linear velocity vx, vy, vz
                   false, false, true,    # angular velocity vr, vp, vyaw
                   false, false, false]   # acceleration ax, ay, az
    odom0_queue_size: 10
    odom0_differential: false
    odom0_relative: false

    # IMU input
    imu0: imu
    imu0_config: [false, false, false,   # position x, y, z
                  false, false, true,    # orientation r, p, yaw
                  false, false, false,   # linear velocity vx, vy, vz
                  false, false, true,    # angular velocity vyaw
                  true,  false, false]   # acceleration ax
    imu0_queue_size: 10
    imu0_differential: false
    imu0_relative: true
    imu0_remove_gravitational_acceleration: true
